# frontend: UI web (React + nginx). Entra por el MISMO API Gateway del ambiente:
#   API Gateway  GET /  y  GET /{proxy+}  -> VPC Link -> NLB (listener frontend)
#   -> NodePort 30081 -> Service frontend -> pods stable | canary
# Asi /graphql es del mismo origen (sin CORS) y cada ambiente tiene su propia UI.
# Mismo esquema de canary que los microservicios: stable 4 + canary 0 (1 de 5 = 20%).
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
---
# app-config.json del ambiente (lo reescribe scripts/k8s/deploy.ps1 con las
# URLs de los API Gateway de dev/test/prod para comparar flags en vivo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  app-config.json: |
    { "peers": {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: aegisvolt
    aegisvolt.io/track: stable
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      aegisvolt.io/track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: aegisvolt
        aegisvolt.io/track: stable
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: aegisvolt/frontend:STABLE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Montaje de directorio (no subPath): los cambios del ConfigMap llegan
            # al pod sin reiniciarlo.
            - name: config
              mountPath: /usr/share/nginx/html/runtime
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: frontend-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-canary
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: aegisvolt
    aegisvolt.io/track: canary
spec:
  replicas: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      aegisvolt.io/track: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: aegisvolt
        aegisvolt.io/track: canary
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: aegisvolt/frontend:CANARY
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Montaje de directorio (no subPath): los cambios del ConfigMap llegan
            # al pod sin reiniciarlo.
            - name: config
              mountPath: /usr/share/nginx/html/runtime
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: frontend-config
