# graphql-gateway: Capa de agregacion GraphQL + orquestador SAGA
#
# Canary: dos Deployments (stable y canary) con el MISMO label
# app.kubernetes.io/name y un Service que selecciona solo por ese label.
# kube-proxy reparte las conexiones entre TODOS los pods listos, asi que el
# porcentaje de trafico del canary = replicas canary / replicas totales
# (1 de 5 = 20%). En reposo el canary tiene 0 replicas.
#
# Las imagenes aegisvolt/graphql-gateway:STABLE|CANARY son marcadores: el pipeline
# los reemplaza por la imagen real de ECR (scripts/k8s/deploy.ps1).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: graphql-gateway
  labels:
    app.kubernetes.io/name: graphql-gateway
  # EKS Pod Identity asocia esta ServiceAccount al rol IAM
  # aegisvolt-<env>-graphql-gateway (Terraform: aws_eks_pod_identity_association).
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
  labels:
    app.kubernetes.io/name: graphql-gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: graphql-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  labels:
    app.kubernetes.io/name: graphql-gateway
    app.kubernetes.io/part-of: aegisvolt
    aegisvolt.io/track: stable
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
      aegisvolt.io/track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-gateway
        app.kubernetes.io/part-of: aegisvolt
        aegisvolt.io/track: stable
    spec:
      serviceAccountName: graphql-gateway
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: aegisvolt/graphql-gateway:STABLE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: aegisvolt-config
            - secretRef:
                name: aws-credentials
          env:
            - name: TRACK
              value: stable
            - name: PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway-canary
  labels:
    app.kubernetes.io/name: graphql-gateway
    app.kubernetes.io/part-of: aegisvolt
    aegisvolt.io/track: canary
spec:
  replicas: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
      aegisvolt.io/track: canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-gateway
        app.kubernetes.io/part-of: aegisvolt
        aegisvolt.io/track: canary
    spec:
      serviceAccountName: graphql-gateway
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: aegisvolt/graphql-gateway:CANARY
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: aegisvolt-config
            - secretRef:
                name: aws-credentials
          env:
            - name: TRACK
              value: canary
            - name: PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
