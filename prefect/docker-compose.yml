# Prefect: observabilidad de los tres ambientes AegisVolt.
#
#   docker compose -f prefect/docker-compose.yml up -d --build
#   Dashboard: http://localhost:4200
#
# Requiere Floci levantado (infra/floci/docker-compose.yml): el worker se une a
# la red "aegisvolt" y llega a Floci como http://floci:4566 (NO es AWS real).
name: aegisvolt-prefect

services:
  prefect-server:
    image: prefecthq/prefect:3.1.15-python3.11
    command: prefect server start --host 0.0.0.0
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      # La UI corre en el navegador: necesita una URL alcanzable desde ahi.
      PREFECT_UI_API_URL: http://127.0.0.1:4200/api
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - aegisvolt

  prefect-observer:
    build: .
    restart: unless-stopped
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    networks:
      - aegisvolt

volumes:
  prefect-data:
    name: aegisvolt-prefect-data

networks:
  aegisvolt:
    external: true
